# ==============================================================================
# RelayChat (chatapp.in) — Production Nginx TLS + WebSocket + Federation Proxy
# ==============================================================================

limit_req_zone $binary_remote_addr zone=relaychat_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=relaychat_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=relaychat_fed:10m rate=180r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream relaychat_backend {
    server backend:8000;
    keepalive 32;
}

upstream relaychat_frontend {
    server frontend:3000;
    keepalive 32;
}

# 1. HTTP (Port 80): Let's Encrypt ACME HTTP-01 challenge + 301 Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_DOMAIN};

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (Port 443): TLS 1.2/1.3 Termination + Security Headers + Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SERVER_DOMAIN};

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/${SERVER_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # Up to 100 MB E2EE encrypted attachment chunks (+ framing overhead)
    client_max_body_size 108m;

    # Hardened Production Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; media-src 'self' blob: data:; connect-src 'self' wss: https:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Federation Discovery (/.well-known/chat-server)
    location = /.well-known/chat-server {
        limit_req zone=relaychat_fed burst=30 nodelay;
        proxy_pass http://relaychat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Federation S2S Signed Endpoints
    location /federation/ {
        limit_req zone=relaychat_fed burst=60 nodelay;
        proxy_pass http://relaychat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Real-time WebSocket Hub (/ws)
    location /ws {
        proxy_pass http://relaychat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Auth Endpoints (stricter IP burst protection)
    location /auth/ {
        limit_req zone=relaychat_auth burst=10 nodelay;
        proxy_pass http://relaychat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend REST API Routes
    location ~ ^/(api/|users|contacts|blocks|conversations|messages|groups|attachments|statuses|push|health) {
        limit_req zone=relaychat_api burst=80 nodelay;
        proxy_pass http://relaychat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Prometheus Metrics (restricted to private/monitoring CIDRs)
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://relaychat_backend;
        proxy_set_header Host $host;
    }

    # Next.js PWA Frontend
    location / {
        proxy_pass http://relaychat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
